name: Deploy web-sender to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web-sender/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-sender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-sender/package-lock.json
      - run: npm ci
      - run: npm test
      - run: VITE_BASE=/UPI_Without_Internet/ npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-sender/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
